<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>The Hits Radio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  background: radial-gradient(circle at top, #182300 0%, #111 45%, #090909 100%);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
.player {
  width: min(100%, 390px);
  background: rgba(25,25,25,.96);
  border-radius: 28px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 18px 60px rgba(0,0,0,.55);
}
.brand { font-size: 36px; font-weight: 900; letter-spacing: 1px; margin: 0; }
.top-logo { width: 190px; max-width: 70%; height: 72px; object-fit: cover; object-position: center; border-radius: 12px; }
.tagline { opacity: .62; font-size: 13px; margin-top: 5px; }
.live { color: #c8ff1a; font-weight: 800; margin: 16px 0 22px; }
.cover {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 20px;
  background: linear-gradient(145deg,#292929,#151515);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
  margin-bottom: 22px;
  overflow: hidden;
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
#fallbackLogo { display: block; }
#cover { display: none; }
.label { opacity: .58; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; }
.song { font-size: 20px; font-weight: 800; line-height: 1.3; margin: 8px 0 20px; min-height: 52px; }
.program { font-size: 14px; opacity: .8; margin-bottom: 24px; }
button {
  width: 100%;
  border: 0;
  border-radius: 999px;
  padding: 17px 20px;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  background: #b8f20c;
  color: #0a0a0a;
}
button:active { transform: scale(.985); }
.status { min-height: 18px; margin-top: 13px; font-size: 12px; opacity: .6; }
.volume-control {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0 4px;
}
.volume-icon { font-size: 18px; }
.volume-control input[type="range"] {
  flex: 1;
  accent-color: #b8ff00;
  cursor: pointer;
}
.volume-value {
  min-width: 42px;
  text-align: right;
  font-size: 12px;
  color: #aaa;
}
.history { margin-top: 28px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.08); text-align: left; }
.history-title { color: #b8f20c; margin-bottom: 12px; }
.history-item { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
@media (max-width: 420px) {
  body { padding: 12px; align-items: flex-start; }
  .player { margin-top: 10px; padding: 25px 19px; border-radius: 24px; }
  .brand { font-size: 32px; }
}

.volume-panel {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 20px 0 6px;
  padding: 13px 14px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(184,255,0,.18);
  border-radius: 14px;
}
.vol-icon { font-size: 16px; line-height: 1; }
.volume-slider {
  flex: 1;
  min-width: 0;
  accent-color: #b8ff00;
  cursor: pointer;
}
.volume-value {
  width: 38px;
  text-align: right;
  color: #b8ff00;
  font-size: 12px;
  font-weight: 800;
}

</style>
</head>
<body>
<main class="player">
  <img class="top-logo" src="the-hits-logo.png" alt="The Hits">
  <div class="tagline">No repeats. Just beats.</div>
  <div class="live">● LIVE RADIO</div>

  <div class="cover" id="coverBox"><img id="fallbackLogo" src="the-hits-logo.png" alt="The Hits"><img id="cover" alt="Albumcover"></div>

  <div class="label">🎵 NÅ SPILLES</div>
  <div class="song" id="nowPlaying">Henter låt…</div>

  <div class="program">📻 <span id="program">THE HITS</span></div>

  <audio id="radio" preload="none"></audio>
  <button id="playButton">▶ Spill The Hits</button>
  <div class="status" id="status">Klar til å spille</div>
  <div class="volume-panel">
    <span id="volLow" class="vol-icon">🔉</span>
    <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="80" aria-label="Volum">
    <span class="vol-icon">🔊</span>
    <span id="volumeValue" class="volume-value">80%</span>
  </div>

  <section class="history">
    <div class="label history-title">SIST SPILT</div>
    <div id="historyList" class="history-list">Ingen historikk ennå</div>
  </section>
</main>

<script>
const BASE = "https://fascinating-raid-loved-them.trycloudflare.com";
const MOUNT = "/thehits";
const STREAM_URL = BASE + MOUNT;
const STATUS_URL = BASE + "/status-json.xsl";

const radio = document.getElementById("radio");
const button = document.getElementById("playButton");
const statusText = document.getElementById("status");
const nowPlaying = document.getElementById("nowPlaying");
const program = document.getElementById("program");

radio.src = STREAM_URL;

button.addEventListener("click", async () => {
  if (radio.paused) {
    try {
      // Refresh the live stream so Play starts close to "now".
      radio.src = STREAM_URL + "?t=" + Date.now();
      await radio.play();
      button.textContent = "⏸ Pause";
      statusText.textContent = "🔴 LIVE";
    } catch (e) {
      statusText.textContent = "Kunne ikke starte streamen";
    }
  } else {
    radio.pause();
    button.textContent = "▶ Spill The Hits";
    statusText.textContent = "Pauset";
  }
});

function getSources(data) {
  const source = data && data.icestats && data.icestats.source;
  if (!source) return [];
  return Array.isArray(source) ? source : [source];
}

function getTheHitsSource(data) {
  const sources = getSources(data);
  return sources.find(s => {
    const listen = String(s.listenurl || "");
    return listen.endsWith(MOUNT) || listen.includes(MOUNT);
  }) || sources[0] || null;
}

function extractTitle(source) {
  if (!source) return "";

  if (typeof source.title === "string" && source.title.trim()) {
    return source.title.trim();
  }

  const playlist = source.playlist;
  if (playlist) {
    let tracks = playlist.track ?? playlist.TrackList ?? playlist.trackList;

    // Icecast can expose track as an object, array, or nested TrackList object.
    if (tracks && !Array.isArray(tracks) && tracks.track) tracks = tracks.track;
    if (tracks && !Array.isArray(tracks) && tracks.Track) tracks = tracks.Track;

    if (Array.isArray(tracks) && tracks.length) {
      const t = tracks[tracks.length - 1];
      if (typeof t === "string") return t;
      if (t && typeof t.title === "string") return t.title;
    }

    if (tracks && typeof tracks.title === "string") return tracks.title;
  }

  // Last fallback: recursively look for a metadata title.
  const metadata = source.metadata;
  if (metadata && typeof metadata === "object") {
    for (const [key, value] of Object.entries(metadata)) {
      if (key.toLowerCase().includes("title") && typeof value === "string" && value.trim()) {
        return value.trim();
      }
    }
  }
  return "";
}

const API_URL = "https://wave-margin-hawaiian-shopzilla.trycloudflare.com/api/status";
let lastCover = "";

function showCover(url) {
  const cover = document.getElementById("cover");
  const fallbackLogo = document.getElementById("fallbackLogo");

  if (!url) {
    cover.style.display = "none";
    fallbackLogo.style.display = "block";
    return;
  }

  if (url === lastCover) return;
  lastCover = url;
  cover.onload = () => {
    cover.style.display = "block";
    fallbackLogo.style.display = "none";
  };
  cover.onerror = () => {
    cover.style.display = "none";
    fallbackLogo.style.display = "block";
  };
  cover.src = url;
}

function renderHistory(items) {
  const list = document.getElementById("historyList");
  if (!items || !items.length) {
    list.textContent = "Ingen historikk ennå";
    return;
  }
  list.innerHTML = "";
  items.slice(0, 5).forEach(title => {
    const row = document.createElement("div");
    row.className = "history-item";
    row.textContent = "♪ " + title;
    list.appendChild(row);
  });
}

async function updateFromBot() {
  try {
    const response = await fetch(API_URL + "?t=" + Date.now(), {cache: "no-store"});
    if (!response.ok) return false;
    const data = await response.json();

    if (data.title) nowPlaying.textContent = data.title;
    if (data.program) program.textContent = data.program;
    showCover(data.cover || "");
    renderHistory(data.history || []);
    return true;
  } catch (e) {
    return false;
  }
}

const volumeSlider = document.getElementById("volumeSlider");
const volumeValue = document.getElementById("volumeValue");

const savedVolume = localStorage.getItem("theHitsVolume");
const initialVolume = savedVolume !== null ? Number(savedVolume) : 80;
volumeSlider.value = initialVolume;
radio.volume = initialVolume / 100;
volumeValue.textContent = initialVolume + "%";

volumeSlider.addEventListener("input", () => {
  const value = Number(volumeSlider.value);
  radio.volume = value / 100;
  volumeValue.textContent = value + "%";
  localStorage.setItem("theHitsVolume", String(value));
});

async function updateNowPlaying() {
  if (await updateFromBot()) return;
  try {
    const response = await fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    const source = getTheHitsSource(data);
    const title = extractTitle(source);

    const displayTitle = title || "THE HITS";
    nowPlaying.textContent = displayTitle;
    program.textContent = (source && (source.server_name || source.server_description)) || "THE HITS";

  } catch (e) {
    nowPlaying.textContent = "THE HITS";
    program.textContent = "THE HITS";
  }
}

updateNowPlaying();
setInterval(updateNowPlaying, 7000);

</script>
</body>
</html>
