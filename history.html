<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web 2.0 • Spillehistorikk • The Hits</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#152400,#070707 70%);font-family:Arial,sans-serif;color:#fff;padding:24px 14px}.wrap{width:820px;max-width:100%;margin:auto}.card{background:#181918;border-radius:28px;padding:26px}.logo{display:block;width:170px;height:65px;object-fit:cover;border-radius:12px;margin:auto}.tag{text-align:center;color:#aaa;font-size:12px;margin:6px 0 25px}.sub{color:#aaa;font-size:13px;margin-bottom:22px}.nav{display:flex;gap:8px;margin-bottom:22px}.nav button,.back{border:1px solid #b7ff0045;background:#ffffff08;color:#fff;border-radius:12px;padding:11px 13px;font-weight:800;text-decoration:none}.nav button{flex:1}.nav .active{background:#b7ff00;color:#050505}.day{color:#b7ff00;font-size:13px;font-weight:900;margin:22px 0 16px}.program{margin-bottom:24px;border:1px solid #ffffff12;border-radius:18px;overflow:hidden}.pt{padding:13px 16px;background:#ffffff08;color:#b7ff00;font-weight:900}.row{display:grid;grid-template-columns:55px 64px 1fr;gap:13px;align-items:center;padding:11px 14px;border-top:1px solid #ffffff0d}.time{color:#b7ff00;font-weight:900}.cover,.fallback{width:58px;height:58px;border-radius:10px;background:#292929}.cover{object-fit:cover}.fallback{display:flex;align-items:center;justify-content:center;font-size:23px}.song{font-weight:800}.empty{padding:28px;text-align:center;color:#aaa}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.count{font-size:12px;color:#888}.mini{position:sticky;bottom:10px;margin-top:18px;background:#0d0f0d;border:1px solid #b7ff0045;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px #000}.mini button{border:0;border-radius:10px;background:#b7ff00;font-weight:900;padding:10px 13px}.mini-info{min-width:0;flex:1}.mini-now{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-program{font-size:11px;color:#9a9a9a}.mini input{width:90px}@media(max-width:560px){.card{padding:18px}.row{grid-template-columns:43px 50px 1fr;gap:9px}.cover,.fallback{width:48px;height:48px}}</style></head>
<body><div class="wrap"><div class="card"><img class="logo" src="the-hits-logo.png"><div class="tag">No repeats. Just beats.</div><h1>🕘 Spillehistorikk</h1><div class="sub">Se hva som har blitt spilt, sortert etter program.</div><div class="nav"><button id="prev">← Forrige dag</button><button id="today" class="active">I dag</button><button id="next">Neste dag →</button></div><div id="content">Henter...</div><div class="mini"><button id="miniPlay">▶</button><div class="mini-info"><div id="miniNow" class="mini-now">The Hits</div><div id="miniProgram" class="mini-program">LIVE</div></div><span>🔊</span><input id="miniVol" type="range" min="0" max="100" value="80"><audio id="miniRadio"></audio></div><div class="footer"><a class="back" href="index.html">← Tilbake til The Hits</a><span id="count" class="count"></span></div></div></div>
<script>
const q=new URLSearchParams(location.search),S=q.get("api")||"",STREAM=q.get("stream")||localStorage.getItem("theHitsStream")||"",API=S.replace(/\/api\/status(?:\?.*)?$/,"/api/history"),C=document.getElementById("content"),N=document.getElementById("count");let H=[],D=new Date();D.setHours(12,0,0,0);
const K=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),E=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
function programAt(t){
 const d=new Date(t),m=d.getHours()*60+d.getMinutes(),wd=d.getDay(),weekend=(wd===0||wd===6);
 if(!weekend){
  if(m<360)return "The Hits NON STOP NIGHT";
  if(m<720)return "Dance Morgen";
  if(m<900)return "Rush Hits";
  return "The Hits NON STOP";
 }
 if(m<360)return "The Hits NON STOP";
 if(m<720)return "Non Stop Helg";
 if(m<1080)return "Non Stop Helg";
 if(m<1320)return "Dance Mix";
 return "The Hits NON STOP";
}
function R(){
 let rows=H.filter(x=>x&&x.played_at&&K(new Date(x.played_at))===K(D)),gs=[];
 for(const x of rows){
  const replay=String(x.program||"").toUpperCase().includes("RE:PLAY");
  let n=replay?programAt(x.played_at):((x.program||"Ukjent program").trim()||"Ukjent program");
  let g=gs.find(y=>y.n===n);if(!g){g={n,items:[]};gs.push(g)}
  g.items.push({...x,_replay:replay});
 }
 let s=`<div class="day">${K(D)===K(new Date())?"I DAG":E(D.toLocaleDateString("no-NO",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase())}</div>`;
 if(!rows.length)s+='<div class="empty">Ingen registrerte låter denne dagen.</div>';
 for(const g of gs){
  g.items.sort((a,b)=>new Date(b.played_at)-new Date(a.played_at));
  s+=`<section class="program"><div class="pt">📻 ${E(g.n.toUpperCase())}</div>`;
  for(const x of g.items){
   let tm=new Date(x.played_at).toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"}),
   pic=x.cover?`<img class="cover" src="${E(x.cover)}" loading="lazy">`:'<div class="fallback">♪</div>',
   label=x._replay?'<span style="color:#b7ff00;font-size:11px;font-weight:900;display:block;margin-bottom:3px">🔁 RE:PLAY</span>':'';
   s+=`<div class="row"><div class="time">${tm}</div>${pic}<div class="song">${label}${E(x.title)}</div></div>`;
  }
  s+="</section>";
 }
 C.innerHTML=s;N.textContent=rows.length?rows.length+" låter":"";
 let now=K(D)===K(new Date());today.classList.toggle("active",now);next.disabled=now;next.style.opacity=now?".4":"1";
}
prev.onclick=()=>{D.setDate(D.getDate()-1);R()};next.onclick=()=>{if(K(D)!==K(new Date())){D.setDate(D.getDate()+1);R()}};today.onclick=()=>{D=new Date();D.setHours(12,0,0,0);R()};
async function L(){try{let r=await fetch(API+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;let d=await r.json();H=Array.isArray(d.history)?d.history:[];R()}catch(e){C.innerHTML='<div class="empty">Kunne ikke hente spillehistorikken akkurat nå.</div>'}}L();setInterval(L,30000);

const mr=document.getElementById("miniRadio"),mb=document.getElementById("miniPlay"),mv=document.getElementById("miniVol"),mn=document.getElementById("miniNow"),mp=document.getElementById("miniProgram");
if(STREAM){mr.src=STREAM;localStorage.setItem("theHitsStream",STREAM)}
let sv=Number(localStorage.getItem("theHitsVolume")??80);mv.value=sv;mr.volume=sv/100;
mv.oninput=()=>{mr.volume=Number(mv.value)/100;localStorage.setItem("theHitsVolume",mv.value)};
async function miniStart(){try{await mr.play();mb.textContent="Ⅱ";localStorage.setItem("theHitsPlaying","1")}catch(e){}}
mb.onclick=()=>{if(mr.paused)miniStart();else{mr.pause();mb.textContent="▶";localStorage.setItem("theHitsPlaying","0")}};
if(localStorage.getItem("theHitsPlaying")==="1"&&STREAM) miniStart();
async function miniMeta(){try{let r=await fetch(S+"?t="+Date.now(),{cache:"no-store"}),d=await r.json();mn.textContent=d.title||"The Hits";mp.textContent="● "+(d.program||"THE HITS").toUpperCase()}catch(e){}}
miniMeta();setInterval(miniMeta,10000);

</script></body></html>
