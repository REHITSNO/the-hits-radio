<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spillehistorikk • The Hits</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#152400 0,#0b0d0b 45%,#070707 100%);font-family:Arial,sans-serif;color:#fff;padding:24px 14px}
.wrap{width:760px;max-width:100%;margin:auto}.card{background:#181918;border-radius:28px;padding:26px;box-shadow:0 18px 50px #0008}
.logo{display:block;width:170px;height:65px;object-fit:cover;border-radius:12px;margin:0 auto}.tag{text-align:center;color:#aaa;font-size:12px;margin:6px 0 25px}
h1{font-size:25px;margin:0 0 6px}.sub{color:#aaa;font-size:13px;margin-bottom:22px}.nav{display:flex;gap:8px;margin-bottom:22px}
.nav button,.back{border:1px solid #b7ff0045;background:#ffffff08;color:#fff;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer;text-decoration:none}.nav button{flex:1}.nav button.active{background:#b7ff00;color:#050505;border-color:#b7ff00}
.day-title{color:#b7ff00;font-size:13px;font-weight:900;letter-spacing:1px;margin:22px 0 10px}.row{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:13px 4px;border-bottom:1px solid #ffffff0d}.time{color:#b7ff00;font-weight:900}.song{font-weight:800;line-height:1.3}.program{color:#8f8f8f;font-size:11px;margin-top:4px}.empty{padding:28px 0;color:#aaa;text-align:center}
.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}.count{font-size:12px;color:#888}
</style></head><body><div class="wrap"><div class="card">
<img class="logo" src="the-hits-logo.png" alt="The Hits"><div class="tag">No repeats. Just beats.</div>
<h1>🕘 Spillehistorikk</h1><div class="sub">Se hva som har blitt spilt – og når.</div>
<div class="nav"><button id="prev">← Forrige dag</button><button id="today" class="active">I dag</button><button id="next">Neste dag →</button></div>
<div id="content"><div class="empty">Henter spillehistorikk...</div></div>
<div class="footer"><a class="back" href="index.html">← Tilbake til The Hits</a><span id="count" class="count"></span></div>
</div></div>
<script>
const params=new URLSearchParams(location.search);
const STATUS_API=params.get("api")||"";
const HISTORY_API=STATUS_API.replace(/\/api\/status(?:\?.*)?$/,"/api/history");
const content=document.getElementById("content"),count=document.getElementById("count");
const prev=document.getElementById("prev"),today=document.getElementById("today"),next=document.getElementById("next");
let allHistory=[],selectedDate=new Date();selectedDate.setHours(12,0,0,0);
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pretty(d){return dayKey(d)===dayKey(new Date())?"I DAG":d.toLocaleDateString("no-NO",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){const key=dayKey(selectedDate);const rows=allHistory.filter(x=>x&&x.played_at&&dayKey(new Date(x.played_at))===key);
let html=`<div class="day-title">${esc(pretty(selectedDate))}</div>`;
if(!rows.length)html+=`<div class="empty">Ingen registrerte låter denne dagen.</div>`;
else for(const item of rows){const d=new Date(item.played_at);const t=d.toLocaleTimeString("no-NO",{hour:"2-digit",minute:"2-digit"});html+=`<div class="row"><div class="time">${esc(t)}</div><div><div class="song">♪ ${esc(item.title)}</div>${item.program?`<div class="program">${esc(item.program)}</div>`:""}</div></div>`}
content.innerHTML=html;count.textContent=rows.length?`${rows.length} låter`:"";const isToday=key===dayKey(new Date());today.classList.toggle("active",isToday);next.disabled=isToday;next.style.opacity=isToday?".4":"1"}
prev.onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);render()};next.onclick=()=>{if(dayKey(selectedDate)!==dayKey(new Date())){selectedDate.setDate(selectedDate.getDate()+1);render()}};today.onclick=()=>{selectedDate=new Date();selectedDate.setHours(12,0,0,0);render()};
async function loadHistory(){if(!HISTORY_API){content.innerHTML='<div class="empty">Åpne denne siden via «Se hele spillehistorikken» på hovedsiden.</div>';return}try{const r=await fetch(HISTORY_API+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();allHistory=Array.isArray(d.history)?d.history:[];render()}catch(e){content.innerHTML='<div class="empty">Kunne ikke hente spillehistorikken akkurat nå.</div>'}}
loadHistory();setInterval(loadHistory,30000);
</script></body></html>
